name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          # Build for Linux x86_64
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o tg-daily-bot-linux-amd64

          # Build for Linux x86 32-bit
          GOOS=linux GOARCH=386 go build -ldflags "-s -w" -o tg-daily-bot-linux-386

          # Build for Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o tg-daily-bot-linux-arm64

          # Build for macOS Intel
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o tg-daily-bot-darwin-amd64

          # Build for macOS Apple Silicon
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o tg-daily-bot-darwin-arm64

          # Build for Windows
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o tg-daily-bot-windows-amd64.exe

      - name: Create checksums
        run: |
          sha256sum tg-daily-bot-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            tg-daily-bot-linux-amd64
            tg-daily-bot-linux-386
            tg-daily-bot-linux-arm64
            tg-daily-bot-darwin-amd64
            tg-daily-bot-darwin-arm64
            tg-daily-bot-windows-amd64.exe
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
